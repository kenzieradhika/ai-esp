name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Build firmware (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/bin sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core 3.3.10
        run: |
          arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install display libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library" "Adafruit SSD1306"

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32s3:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=cdc,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=custom,PSRAM=opi,DebugLevel=info' \
            --build-property compiler.optimization_flags=-O3 \
            firmware/esp32_llm

  python:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sources
        run: |
          python -m py_compile src/*.py data/*.py firmware/prompt_ui.py firmware/flash_windows.py firmware/flash_download_loop.py firmware/reset_download.py firmware/bootlog.py
