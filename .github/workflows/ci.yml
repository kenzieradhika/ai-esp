name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    name: Build firmware (esp32s3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install arduino-cli
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh | BINDIR=$HOME/bin sh
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Install ESP32 core 3.3.10
        run: |
          arduino-cli config init --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10

      - name: Install display libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library" "Adafruit SSD1306"

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn 'esp32:esp32:esp32s3:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=cdc,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=16M,PartitionScheme=custom,PSRAM=opi,DebugLevel=info' \
            --build-property compiler.optimization_flags=-O3 \
            firmware/esp32_llm

  host-verify:
    name: Host C runtime builds clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build host verifiers (warnings are errors)
        run: |
          cc -O3 -Wall -Wextra -Werror -o /tmp/verify firmware/host_verify/verify.c -lm
          cc -O3 -Wall -Wextra -Werror -o /tmp/ppl_fp32 firmware/host_verify/ppl.c -lm
          cc -O3 -Wall -Wextra -Werror -DLLM_INT8_ACT -o /tmp/ppl_int8 firmware/host_verify/ppl.c -lm
          cc -O3 -Wall -Wextra -Werror -DLLM_INT8_ACT -o /tmp/kernels firmware/host_verify/test_kernels.c -lm
      - name: Run kernel tests
        run: /tmp/kernels

  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile sources
        run: |
          python -m py_compile src/*.py data/*.py firmware/prompt_ui.py firmware/flash_windows.py firmware/flash_download_loop.py firmware/reset_download.py firmware/bootlog.py
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.13" --index-url https://download.pytorch.org/whl/cpu
          pip install "numpy>=2" pytest tokenizers
      - name: Run tests
        run: pytest -q
